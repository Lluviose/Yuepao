name: Build IPA

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Yuepao.xcodeproj \
            -scheme Yuepao \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100 || true

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Yuepao.app"
          test -d "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry Yuepao.ipa Payload
          ls -lh Yuepao.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuepao-${{ github.run_number }}-ipa
          path: dist/Yuepao.ipa
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Yuepao.ipa
