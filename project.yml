name: Yuepao
options:
  bundleIdPrefix: com.lluviose
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Yuepao:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Yuepao
    settings:
      base:
        PRODUCT_NAME: Yuepao
        PRODUCT_BUNDLE_IDENTIFIER: com.lluviose.yuepao
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconDark AppIconMinimal AppIconList"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Config/Info.plist
      properties:
        # 主屏幕上显示的名字（伪装用），想改就改这里
        CFBundleDisplayName: 手账
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: 用于解锁应用，保护你的私密数据
        NSLocationWhenInUseUsageDescription: 用于在地图上显示你的位置、选择地点
        NSPhotoLibraryAddUsageDescription: 只在你点「存到系统相册」时，把这张照片或视频的原文件存回系统相册

  YuepaoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YuepaoUITests
    dependencies:
      - target: Yuepao
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lluviose.yuepao.uitests
        TEST_TARGET_NAME: Yuepao

schemes:
  Yuepao:
    build:
      targets:
        Yuepao: all
        YuepaoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YuepaoUITests
    archive:
      config: Release
